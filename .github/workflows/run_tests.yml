name: Run drevalpy Tests

on:
  push:
    branches:
      - "release/*"
  pull_request:
    branches:
      - "*"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Check lockfile is up to date
        run: uv lock --check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Run ty
        run: uv run ty check

  tests:
    name: Tests (Python ${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Keep the Linux 3.11/3.12/3.13 signal alive when the Windows job fails.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
        include:
          - python-version: "3.13"
            os: windows-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        # The explicit `-m` is load-bearing: `addopts` in pyproject.toml defaults
        # to the fast tier (`-m "not slow and not network"`), and a command-line
        # `-m` *replaces* it rather than adding to it. Without this the job would
        # silently run only the fast tier and the coverage gate would fail.
        # `not network` (rather than no marker at all) deselects the tests that
        # download pretrained weights from the artifacts bucket, which is not
        # readable without credentials; run_network_tests.yml covers those.
        run: uv run pytest -m "not network" --cov --cov-report=xml --cov-report=json

      - name: Coverage floor per module
        # The only place coverage is enforced: the pre-commit hook runs the fast
        # tier without `--cov`, so this job is the gate for both the aggregate
        # `fail_under` and the per-module floors.
        run: uv run python tools/coverage_gate.py

      - name: Module size ceiling
        # Runs here as well as in the prek hook so a PR cannot land the
        # regression by skipping hooks. Needs no test run - it only parses the
        # working tree - so it costs a couple of seconds.
        run: uv run python tools/size_gate.py

      - name: Upload coverage
        if: always() && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@6d497bbcd2616c4cbf2f07268d34081bf421ba2c # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Build docs
        run: uv run --group docs sphinx-build -W docs docs/_build
