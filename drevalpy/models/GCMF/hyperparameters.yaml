GCMF:
  cell_line_views:
    - - gene_expression
  drug_views:
    - - fingerprints
  gene_list:
    - landmark_genes
  n_bits:
    - 256
  hidden_dim:
    - 320
  emb_dim:
    - 160
  n_gnn_layers:
    - 2
  dropout:
    - 0.3
  use_mlp_head:
    - true
  mlp_hidden:
    - 256
  n_mlp_layers:
    - 1
  head_raw_features:
    - false
  use_drug_id_embedding:
    - true
  k_cell:
    - 12
  k_drug:
    - 15
  use_edge_weights:
    - true
  learning_rate:
    - 0.001
  weight_decay:
    - 0.00001
  emb_l2:
    - 0.0
  within_drug_weight:
    - 1.0
  batch_size:
    - 8192
  max_epochs:
    - 300
  patience:
    - 25
  n_ensemble:
    - 5
  seed:
    - 0

