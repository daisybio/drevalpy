---
DIPK:
  batch_size:
    - 64
  lr:
    - 0.0001
  heads:
    - 2
  fc_layer_num:
    - 3
  fc_layer_dim:
    - - 256
      - 128
      - 64
      - 32
      - 16
      - 1
  dropout_rate:
    - 0.3
  epochs:
    - 100
  epochs_autoencoder:
    - 100
  # The autoencoder keys carry the "_autoencoder" suffix on purpose: batch_size, lr and patience
  # above belong to the prediction network and hold different values. The values here are the ones
  # the autoencoder used while they were hard coded.
  lr_autoencoder:
    - 0.0001
  patience_autoencoder:
    - 3
  batch_size_autoencoder:
    - 1024
  patience:
    - 10
