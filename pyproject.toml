[project]
name = "drevalpy"
version = "1.5.1"
description = "Drug response evaluation of cancer cell line drug response models in a fair setting"
authors = [{ name = "DrEvalPy development team" }]
license = "GPL-3.0"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.20",
    "scipy",
    "scikit-learn>=1.4",
    "pandas",
    "networkx",
    "pyyaml",
    "pytorch-lightning>=2.5",
    "torch-geometric",
    "torch-scatter",
    "flaky",
    "requests",
    "plotly",
    "matplotlib",
    "importlib-resources",
    "scikit-posthocs",
    "curve-curator",
    "subword-nmt>=0.3.8",
    "toml>=0.10.2",
    "starlette>=0.49.1",
    "pydantic>=2.5",
    "pyparsing>=3",
    "wandb>=0.24.0",
    "xgboost>=3.2.0",
    "lightgbm>=4.0.0",
    "typer>=0.26,<0.27",
    "rich>=15.0.0",
    "gseapy>=1.1.0",
    "mygene",
    "obonet",
    "optuna",
    "platformdirs>=4.0",
    "fsspec[full]",
    "universal-pathlib",
    "filelock>=3.0",
    "typing-extensions>=4.12.0",
    "mudata>=0.3.10",
    "rdkit>=2026.3.4",
    "transformers>=5.14.0",
    "gensim>=4.4.0",
    "multiqc>=1.35",
]

[project.optional-dependencies]
cpu = [
    "torch>=2.1",
]
cu126 = [
    "torch>=2.1",
]
cu130 = [
    "torch>=2.1",
]

[project.scripts]
drevalpy = "drevalpy.cli.main:cli_main"

[dependency-groups]
dev = [
    "ruff>=0.15.8",
    "ty",
    "prek",
    "pytest",
    "pytest-cov",
    "coverage",
    "complexipy",
    "pygments",
    "xdoctest",
    "types-PyYAML",
    "types-toml",
    "jupyter>=1.1.1",
    "vulture>=2.16",
]
docs = [
    "sphinx>=4.0.2",
    "sphinx-autobuild>=2021.3.14",
    "sphinx-autodoc-typehints",
    "sphinx-rtd-theme>=1.0.0,<3.0.3",
    "sphinx-design>=0.7.0",
    "sphinxcontrib-mermaid>=2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
exclude-newer = "3 weeks"
extra-build-dependencies = { torch-scatter = ["torch"] }
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu126" },
        { extra = "cu130" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "I",
    "UP",
    "B",
    "S",
    "D",
    "N",
    "C90",
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "D101", "D102", "D103"]
"drevalpy/datasets/curvecurator.py" = ["S404", "S603"]
"*.ipynb" = ["E402", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
docstring-code-format = true

[tool.ty]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.rules]
# Optional dependencies not installed in dev venv (rdkit, transformers, gensim, etc.)
unresolved-import = "ignore"
# Incomplete third-party stubs (pandas, matplotlib, torch)
invalid-argument-type = "ignore"
no-matching-overload = "ignore"
# ty beta: does not support type[Any] in return annotations (featurizer registry pattern)
invalid-type-form = "ignore"
# Standard PyTorch Dataset.__getitem__ override pattern
invalid-method-override = "ignore"
# ty beta: false positive on pytest.skip(reason)
too-many-positional-arguments = "ignore"
# Tests intentionally violate types to test immutability (all have # type: ignore)
invalid-assignment = "ignore"
# Complex return type narrowing ty cannot yet handle
invalid-return-type = "ignore"
# scikit-learn TransformerMixin stub does not declare .fit/.transform
unresolved-attribute = "ignore"
# Tests intentionally pass wrong args (all have # type: ignore)
missing-argument = "ignore"
unknown-argument = "ignore"
# Informational only
redundant-cast = "ignore"
deprecated = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/cli_old"]
pythonpath = ["."]
addopts = ["--import-mode=importlib"]

[tool.complexipy]
max-complexity-allowed = 15
