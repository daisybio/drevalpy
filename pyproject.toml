[project]
name = "drevalpy"
version = "2.0.0"
description = "Drug response evaluation of cancer drug response models in a fair setting"
authors = [{ name = "DrEvalPy development team" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.20",
    "scipy",
    "scikit-learn>=1.4",
    "pandas",
    "pyarrow",
    "anndata",
    "joblib",
    "networkx",
    "pyyaml",
    "pytorch-lightning>=2.5",
    "torch-geometric",
    # multiqc pins kaleido 0.2.1, and plotly>=6.1 needs kaleido>=1.
    "plotly>=5.18,<6.1",
    "kaleido==0.2.1",
    "matplotlib",
    "scikit-posthocs>=0.17.0",
    "curve-curator",
    "subword-nmt>=0.3.8",
    "pydantic>=2.5",
    "pyparsing>=3",
    "wandb>=0.24.0",
    "xgboost>=3.2.0",
    "lightgbm>=4.0.0",
    "typer>=0.26,<0.27",
    "rich>=15.0.0",
    "gseapy>=1.1.0",
    "optuna",
    "platformdirs>=4.0",
    "fsspec[s3,http]",
    "universal-pathlib",
    "filelock>=3.15.2",
    "mudata>=0.3.10,<0.4", # 0.4 removed `mudata.set_options`
    "rdkit>=2026.3.4",
    "transformers>=5.14.0",
    "gensim>=4.4.0",
    "multiqc>=1.35",
]

[project.optional-dependencies]
cpu = [
    "torch>=2.1",
]
cu126 = [
    "torch>=2.1",
]
cu130 = [
    "torch>=2.1",
]

[project.scripts]
drevalpy = "drevalpy.cli.main:cli_main"

[dependency-groups]
dev = [
    "ruff>=0.15.8",
    "ty",
    "prek",
    "pytest",
    "pytest-cov",
    "complexipy",
    "types-PyYAML",
    "pydoclint>=0.11.0",
]
docs = [
    "sphinx>=4.0.2",
    "sphinx-autobuild>=2021.3.14",
    "sphinx-autodoc-typehints",
    "sphinx-design>=0.7.0",
    "sphinxcontrib-mermaid>=2.1.0",
    "myst-parser>=4.0.0",
    "pydata-sphinx-theme>=0.16",
]

# src/ layout keeps this repo's tests/, tools/ and docs/ off sys.path of an editable install.
[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "3 weeks"
# xgboost's nvidia-nccl-cu12 and torch's cu13 NCCL share libnccl.so.2; older cu12
# releases make `import torch` fail on an undefined ncclCommResume symbol.
override-dependencies = ["nvidia-nccl-cu12>=2.30.7; sys_platform == 'linux'"]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu126" },
        { extra = "cu130" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-cu130", extra = "cu130" },
]
curve-curator = { git = "https://github.com/nictru/curve_curator.git" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "I",
    "UP",
    "B",
    "S",
    "D",
    "N",
    "C90",
    "ANN001", "ANN201", "ANN202", "ANN204",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "D101", "D102", "D103", "D401", "ANN001", "ANN201", "ANN202", "ANN204"]
"tools/*" = ["ANN001", "ANN201", "ANN202", "ANN204"]
"docs/*" = ["ANN001", "ANN201", "ANN202", "ANN204"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
docstring-code-format = true

[tool.pydoclint]
style = "sphinx"
arg-type-hints-in-docstring = false
check-return-types = false
skip-checking-short-docstrings = true
check-class-attributes = false
allow-init-docstring = true
check-yield-types = false

[tool.ty.environment]
python-version = "3.11"

[tool.ty.rules]
# tests/docs/ imports the docs/ generators, which are put on sys.path at runtime.
unresolved-import = "ignore"
# Incomplete third-party stubs (pandas, torch, sklearn) and ty beta gaps.
invalid-argument-type = "ignore"
no-matching-overload = "ignore"
unresolved-attribute = "ignore"
invalid-method-override = "ignore"
invalid-assignment = "ignore"
missing-argument = "ignore"
unknown-argument = "ignore"
invalid-type-form = "ignore"
too-many-positional-arguments = "ignore"
invalid-return-type = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib", "-m", "not slow and not network"]
markers = [
    "network: requires downloading pretrained weights or remote annotations",
    "slow: extended tier - spawns interpreters, fits curves, or trains models; CI only",
]

[tool.coverage.run]
source = ["drevalpy"]
relative_files = true
omit = ["*/gene_lists/_make_gene_lists.py"]

[tool.coverage.report]
fail_under = 89
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "@overload",
]

# Per-module coverage floor; rules in "Coverage gate" in AGENTS.md.
[tool.drevalpy.coverage_gate]
min_file_coverage = 80

[tool.complexipy]
max-complexity-allowed = 15
