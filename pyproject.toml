[project]
name = "drevalpy"
version = "1.5.1"
description = "Drug response evaluation of cancer cell line drug response models in a fair setting"
authors = [{ name = "DrEvalPy development team" }]
license = "GPL-3.0"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.20",
    "scipy",
    "scikit-learn>=1.4",
    "pandas",
    "pyarrow", # pandas.read_parquet engine for `drevalpy.cli.curate`
    "anndata",
    "joblib",
    "networkx",
    "pyyaml",
    "pytorch-lightning>=2.5",
    "torch-geometric",
    "plotly",
    "matplotlib",
    "scikit-posthocs",
    "curve-curator",
    "subword-nmt>=0.3.8",
    "pydantic>=2.5",
    "pyparsing>=3",
    "wandb>=0.24.0",
    "xgboost>=3.2.0",
    "lightgbm>=4.0.0",
    "typer>=0.26,<0.27",
    "rich>=15.0.0",
    "gseapy>=1.1.0",
    "optuna",
    "platformdirs>=4.0",
    # Named backends, not `full`: shipped code only reaches s3://, http(s):// and
    # file://, and `full` pulled 18 packages to serve protocols nothing can reach.
    # Registering another protocol with `register_source` means installing its backend.
    "fsspec[s3,http]",
    "universal-pathlib",
    "filelock>=3.15.2",
    "mudata>=0.3.10",
    "rdkit>=2026.3.4",
    "transformers>=5.14.0",
    "gensim>=4.4.0",
    "multiqc>=1.35",
    # Imported by no drevalpy module: it is what the `dev-mode-exact` editable
    # install's generated finder imports, so without it `import drevalpy` fails.
    # It must sit here, not in the dev group - uv reads this file's static metadata
    # for path dependencies and never sees the editable wheel's Requires-Dist, so
    # repos that path-install drevalpy editable (both plugin repos) broke on import.
    "editables>=0.3",
]

[project.optional-dependencies]
cpu = [
    "torch>=2.1",
]
cu126 = [
    "torch>=2.1",
]
cu130 = [
    "torch>=2.1",
]

[project.scripts]
drevalpy = "drevalpy.cli.main:cli_main"

[dependency-groups]
dev = [
    "ruff>=0.15.8",
    "ty",
    "prek",
    "pytest",
    "pytest-cov",
    "coverage",
    "complexipy",
    "flaky",
    "xdoctest",
    "types-PyYAML",
    "jupyter>=1.1.1",
    "vulture>=2.16",
]
docs = [
    "sphinx>=4.0.2",
    "sphinx-autobuild>=2021.3.14",
    "sphinx-autodoc-typehints",
    "sphinx-rtd-theme>=1.0.0,<3.0.3",
    "sphinx-design>=0.7.0",
    "sphinxcontrib-mermaid>=2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The default editable install puts the bare project root on sys.path, so a
# consumer's `import tests.conftest` resolved to drevalpy's tests. `dev-mode-exact`
# maps only the `drevalpy` package. Costs: some IDEs cannot follow the import hook,
# and the generated finder needs `editables` at run time. A `src/` layout would fix
# the leak with neither cost, but moving the package is a repo-wide change.
[tool.hatch.build]
dev-mode-exact = true

[tool.hatch.build.targets.wheel]
packages = ["drevalpy"]
# Not a .py file, so PEP 561 needs it named explicitly; tests/plugin/test_init.py
# asserts it ships.
artifacts = ["drevalpy/py.typed"]

[tool.uv]
exclude-newer = "3 weeks"
# nvidia-nccl-cu12 (via xgboost) and nvidia-nccl-cu13 (via the cu13 torch wheel)
# ship the same libnccl.so.2, so whichever unpacks last owns it. Pinning cu12 to
# the NCCL release torch's cu13 build expects keeps the library compatible either
# way; below it, `import torch` failed on an undefined ncclCommResume symbol and
# every torch-based component silently dropped out of the registries.
override-dependencies = ["nvidia-nccl-cu12>=2.30.7; sys_platform == 'linux'"]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu126" },
        { extra = "cu130" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-cu130", extra = "cu130" },
]
curve-curator = { git = "https://github.com/nictru/curve_curator.git" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "I",
    "UP",
    "B",
    "S",
    "D",
    "N",
    "C90",
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "D101", "D102", "D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
docstring-code-format = true

[tool.ty]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.rules]
# tests/docs/ imports the docs/ generators (`_model_zoo`, `_cli_click`,
# `_generated_io`), which live outside the package and go on sys.path at runtime.
# Narrow to a per-file ignore once ty supports it.
unresolved-import = "ignore"
# Incomplete third-party stubs (pandas, matplotlib, torch)
invalid-argument-type = "ignore"
no-matching-overload = "ignore"
# scikit-learn TransformerMixin stub does not declare .fit/.transform
unresolved-attribute = "ignore"
# Standard PyTorch Dataset.__getitem__ override pattern
invalid-method-override = "ignore"
# Tests violate types deliberately, each with its own `# type: ignore`
invalid-assignment = "ignore"
missing-argument = "ignore"
unknown-argument = "ignore"
# ty beta limitations: type[Any] in return annotations (the featurizer registry
# pattern), pytest.skip(reason), and return-type narrowing
invalid-type-form = "ignore"
too-many-positional-arguments = "ignore"
invalid-return-type = "ignore"
# Informational only
redundant-cast = "ignore"
deprecated = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Default run is the fast tier. A command-line `-m` replaces this one rather than
# adding to it, so CI's `-m "not network"` still selects the whole suite.
addopts = ["--import-mode=importlib", "-m", "not slow and not network"]
markers = [
    "network: requires downloading pretrained weights or remote annotations",
    "slow: extended tier - spawns interpreters, fits curves, or trains models; CI only",
]

[tool.coverage.run]
source = ["drevalpy"]
relative_files = true
omit = ["*/gene_lists/_make_gene_lists.py"] # maintenance script, not shipped logic

[tool.coverage.report]
# Keep about a point of headroom below the measured figure so an unrelated
# refactor does not redden CI, and no more: this number only ever moves up.
fail_under = 89
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "@overload",
]

# Per-module floor, enforced by tools/coverage_gate.py because coverage.py can only
# fail on the aggregate, which lets one untested module hide behind a tested package.
[tool.drevalpy.coverage_gate]
min_file_coverage = 60

# Each entry is a module that cannot currently reach min_file_coverage, with the
# reason. An exemption is debt, not a policy decision: delete it (do not lower it)
# once tests bring the module up. The gate prints redundant entries on every run.
#
# The network-gated artifact featurizers are deliberately *not* exempted: their
# download paths are deselected in the measured run, but their offline logic clears
# 60% anyway (chemberta 66%, smilesvec 81%, molgnet 84%, bionic 88%).
[tool.drevalpy.coverage_gate.exemptions]
# In EXCLUDED_MODELS: the ontology featurizer always raises because
# attach_sparsego_ontology_metadata has no production caller, so the predictor
# cannot be trained end to end until that source defect is fixed. `predictor.py`
# used to be exempt at 53 and no longer needs it - direct unit tests of its
# offline paths put it at 62%. `algorithm.py` (34%) and `utils.py` (51%) have
# under a point of margin over their floors, so measure the full `not network`
# suite before touching them; a partial run reads several points high.
"drevalpy/components/predictors/literature/sparsego/algorithm.py" = 33
"drevalpy/components/predictors/literature/sparsego/utils.py" = 51

# Resolving a registered dataset downloads a multi-GB .h5mu from a credentialed S3
# bucket, so only the not-found and cache-hit branches are reachable offline. These
# floors are reproducible on a clean checkout - the cache-eviction helpers are
# unit-tested against synthetic .h5mu files in tmp_path, needing neither
# credentials nor a warm cache. What remains uncovered is the download itself; do
# not chase the last points, it would mean pulling hundreds of megabytes in CI.
"drevalpy/data/datasets/__init__.py" = 44
"drevalpy/data/datasets/_load.py" = 55

# Defensive resolution fallbacks for hand-rolled DRPModel subclasses. Every model
# construct_model() produces sets _base_model_config, so the zoo-lookup and
# model_config()-RuntimeError branches are dead for all shipped models.
"drevalpy/models/mixins/_hyperparameters.py" = 57

# Per-module statement ceiling, enforced by tools/size_gate.py. This is the ratchet
# that keeps the mixin split in models/mixins/ and components/featurizers/ from
# growing back: complexipy already caps per-function complexity, but nothing stopped
# a module from accumulating a fourth unrelated concern's worth of small methods.
#
# Statements, not lines, so the count does not move with formatting or with the
# Google-style docstrings this codebase requires.
#
# Deliberately not a repowise hotspot-health floor, which is what the health plan
# asked for. Measured on this repo: `repowise health` reads 10.0 on the
# `fetch-depth: 1` checkout actions/checkout does by default (every commit-history
# marker silently vanishes), 6.13 on a full clone with no coverage ingested, and
# 6.25 in this working tree with coverage ingested - three different numbers for one
# tree. 68% of its finding impact is derived from commit history, so the score also
# drifts as unrelated commits land. A CI floor on it would fire on innocent PRs and
# pass vacuously on the default checkout. Run `repowise health --trend` locally
# instead; see AGENTS.md.
[tool.drevalpy.size_gate]
max_module_statements = 150

# Each entry is a module that is currently above the ceiling, with the reason. An
# exemption is debt: split the module and delete the entry. A recorded ceiling may
# be lowered as a module shrinks, never raised to let a regression through. Values
# are the counts measured by `uv run python tools/size_gate.py`.
[tool.drevalpy.size_gate.exemptions]
# Vendored third-party network definition: one architecture transcribed from the
# reference implementation. Splitting it would make it harder to diff against
# upstream, not easier to read.
"drevalpy/components/featurizers/drug/_molgnet_network.py" = 255

# The remaining literature predictors still carry the torch plumbing that
# _omics_loaders.py and _pair_predict.py pulled out of their siblings. These are the
# next candidates for the same treatment, in this order.
"drevalpy/components/predictors/literature/sparsego/algorithm.py" = 188
"drevalpy/components/predictors/literature/superfeltr/predictor.py" = 187
"drevalpy/components/predictors/literature/dipk/predictor.py" = 186
"drevalpy/components/predictors/literature/srmf/predictor.py" = 180

# Single cohesive units whose statements are one flat sequence rather than several
# concerns: a declarative registry of builtin components, one dataset facade, one
# component-stack builder, one plot each.
"drevalpy/registry/_builtins.py" = 199
"drevalpy/models/component_stack.py" = 240
"drevalpy/types/data/dataset.py" = 218
"drevalpy/visualization/plots/leaderboard.py" = 177
"drevalpy/types/results/experiment.py" = 156
"drevalpy/components/predictors/neural_network/predictor.py" = 165

[tool.complexipy]
max-complexity-allowed = 15
