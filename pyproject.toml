[project]
name = "drevalpy"
version = "1.5.1"
description = "Drug response evaluation of cancer cell line drug response models in a fair setting"
authors = [{ name = "DrEvalPy development team" }]
license = "GPL-3.0"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.20",
    "scipy",
    "scikit-learn>=1.4",
    "pandas",
    "networkx",
    "pyyaml",
    "pytorch-lightning>=2.5",
    "torch-geometric",
    "torch-scatter",
    "flaky",
    "requests",
    "plotly",
    "matplotlib",
    "importlib-resources",
    "scikit-posthocs",
    "curve-curator",
    "subword-nmt>=0.3.8",
    "toml>=0.10.2",
    "starlette>=0.49.1",
    "pydantic>=2.5",
    "pyparsing>=3",
    "wandb>=0.24.0",
    "xgboost>=3.2.0",
    "lightgbm>=4.0.0",
    "typer>=0.26,<0.27",
    "rich>=15.0.0",
    "gseapy>=1.1.0",
    "mygene",
    "obonet",
    "optuna",
    "platformdirs>=4.0",
    "fsspec[full]",
    "universal-pathlib",
    "filelock>=3.15.2",
    "typing-extensions>=4.12.0",
    "mudata>=0.3.10",
    "rdkit>=2026.3.4",
    "transformers>=5.14.0",
    "gensim>=4.4.0",
    "multiqc>=1.35",
    # No drevalpy module imports this; it is a real requirement of the
    # `dev-mode-exact` editable install configured under [tool.hatch.build]. That
    # mode replaces the .pth full of the project root with a generated
    # _editable_impl_drevalpy.py that does `from editables.redirector import
    # RedirectingFinder`, so the interpreter needs `editables` importable or
    # `import drevalpy` fails outright.
    #
    # It has to sit here rather than in the dev group: hatchling records it as a
    # Requires-Dist of the *editable wheel*, but uv reads static metadata straight
    # from this file for path dependencies and never sees that, and dev groups do
    # not propagate to consumers. A repo that path-installs drevalpy as an
    # editable (both plugin repos do) therefore got `ModuleNotFoundError: No
    # module named 'editables'` on every import.
    #
    # The cost is that non-editable installs carry a 5 KB pypa utility they never
    # execute. Moving the package under `src/` removes both this entry and
    # `dev-mode-exact` - see the comment on [tool.hatch.build].
    "editables>=0.3",
]

[project.optional-dependencies]
cpu = [
    "torch>=2.1",
]
cu126 = [
    "torch>=2.1",
]
cu130 = [
    "torch>=2.1",
]

[project.scripts]
drevalpy = "drevalpy.cli.main:cli_main"

[dependency-groups]
dev = [
    "ruff>=0.15.8",
    "ty",
    "prek",
    "pytest",
    "pytest-cov",
    "coverage",
    "complexipy",
    "pygments",
    "xdoctest",
    "types-PyYAML",
    "types-toml",
    "jupyter>=1.1.1",
    "vulture>=2.16",
]
docs = [
    "sphinx>=4.0.2",
    "sphinx-autobuild>=2021.3.14",
    "sphinx-autodoc-typehints",
    "sphinx-rtd-theme>=1.0.0,<3.0.3",
    "sphinx-design>=0.7.0",
    "sphinxcontrib-mermaid>=2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The default editable install writes a .pth holding the bare project root, which
# puts drevalpy's own `tests`, `tools` and `docs` on sys.path for every consumer
# of the environment - so a plugin repo's `import tests.conftest` resolved to
# drevalpy's tests. `dev-mode-exact` emits a __editable__ finder that maps only
# the `drevalpy` package instead, leaking nothing.
#
# Two documented costs: some IDEs cannot follow the import hook for
# autocompletion, and the generated finder needs `editables` at run time, which is
# why that package is pinned into [project.dependencies] despite no module
# importing it.
#
# A `src/` layout fixes the leak structurally and pays neither cost. It is the
# better long-term answer, deferred here only because moving the package is a
# repo-wide change (nine test modules reach for `<repo>/drevalpy` by path).
[tool.hatch.build]
dev-mode-exact = true

[tool.hatch.build.targets.wheel]
packages = ["drevalpy"]
# py.typed is not a .py file, so it needs to be named explicitly for PEP 561 to
# take effect in the built wheel; tests/plugin/test_init.py asserts it ships.
artifacts = ["drevalpy/py.typed"]

[tool.uv]
exclude-newer = "3 weeks"
extra-build-dependencies = { torch-scatter = ["torch"] }
# nvidia-nccl-cu12 (pulled in by xgboost on Linux) and nvidia-nccl-cu13 (required by
# the CUDA 13 torch wheel that a plain `uv sync` resolves) both ship
# nvidia/nccl/lib/libnccl.so.2, so whichever is unpacked last owns that file. The
# cu126 extra pins nvidia-nccl-cu12==2.29.3, which the resolver also applied to the
# no-extra environment; that build predates ncclCommResume, so whenever it won the
# race `import torch` failed with
# "libtorch_cuda.so: undefined symbol: ncclCommResume" and every torch-based
# component silently dropped out of the registries. Keeping nvidia-nccl-cu12 at the
# NCCL release that torch's cu13 build expects makes the shared library compatible
# regardless of unpack order.
override-dependencies = ["nvidia-nccl-cu12>=2.30.7; sys_platform == 'linux'"]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu126" },
        { extra = "cu130" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-cu130", extra = "cu130" },
]
curve-curator = { git = "https://github.com/nictru/curve_curator.git" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "I",
    "UP",
    "B",
    "S",
    "D",
    "N",
    "C90",
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "D101", "D102", "D103"]
"drevalpy/datasets/curvecurator.py" = ["S404", "S603"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
docstring-code-format = true

[tool.ty]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.rules]
# Not about third-party packages: rdkit/transformers/gensim are core
# [project.dependencies] and resolve fine. The remaining diagnostics are
# tests/docs/ importing the docs/ generators (`_model_zoo`, `_cli_click`,
# `_generated_io`), which live outside the package and are put on sys.path at
# runtime. Once ty supports it, this can be narrowed to a per-file ignore.
unresolved-import = "ignore"
# Incomplete third-party stubs (pandas, matplotlib, torch)
invalid-argument-type = "ignore"
no-matching-overload = "ignore"
# ty beta: does not support type[Any] in return annotations (featurizer registry pattern)
invalid-type-form = "ignore"
# Standard PyTorch Dataset.__getitem__ override pattern
invalid-method-override = "ignore"
# ty beta: false positive on pytest.skip(reason)
too-many-positional-arguments = "ignore"
# Tests intentionally violate types to test immutability (all have # type: ignore)
invalid-assignment = "ignore"
# Complex return type narrowing ty cannot yet handle
invalid-return-type = "ignore"
# scikit-learn TransformerMixin stub does not declare .fit/.transform
unresolved-attribute = "ignore"
# Tests intentionally pass wrong args (all have # type: ignore)
missing-argument = "ignore"
unknown-argument = "ignore"
# Informational only
redundant-cast = "ignore"
deprecated = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib"]
markers = ["network: requires downloading pretrained weights or remote annotations"]

[tool.coverage.run]
source = ["drevalpy"]
relative_files = true
omit = ["*/gene_lists/_make_gene_lists.py"] # maintenance script, not shipped logic

[tool.coverage.report]
# Measured 90.1% for `pytest -m "not network"`, up from 89.5% as the plugin
# facade, test kit and CLI list app landed with tests. Kept about a point of
# headroom so an unrelated refactor does not redden CI, and no more: the point of
# the number is that it only ever moves up.
fail_under = 89
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "@overload",
]

# Per-module coverage floor, enforced by tools/coverage_gate.py because
# coverage.py can only fail on the aggregate percentage, which lets one untested
# module hide behind a well-tested package.
[tool.drevalpy.coverage_gate]
min_file_coverage = 60

# Every entry below records a module that cannot currently reach
# min_file_coverage, together with the reason. An exemption is debt, not a policy
# decision: delete it (do not lower it) once tests bring the module up, and the
# gate prints which entries have become redundant on every run.
#
# Deliberately *not* exempted, so their floors are enforced: the network-gated
# artifact featurizers. Their download paths carry `@pytest.mark.network` and are
# deselected in the measured run, but their offline logic is tested directly and
# clears 60% anyway (chemberta 66%, smilesvec 81%, molgnet 84%, bionic 88%).
[tool.drevalpy.coverage_gate.exemptions]
# SparseGO is in tests/synthetic/variants.py::EXCLUDED_MODELS: its ontology
# featurizer always raises because attach_sparsego_ontology_metadata has no
# production caller, so the predictor and its algorithm cannot be trained end to
# end until that source defect is fixed.
"drevalpy/components/predictors/literature/sparsego/algorithm.py" = 33
"drevalpy/components/predictors/literature/sparsego/predictor.py" = 30
"drevalpy/components/predictors/literature/sparsego/utils.py" = 51

# DIPK is in EXCLUDED_MODELS too: it needs BIONIC's human_ppi_features.tsv, which
# the artifacts bucket refuses to serve anonymously (403), so the predictor's
# train/predict path is unreachable in an offline run. Its pure torch helpers are
# tested directly and are at 96-100%.
"drevalpy/components/predictors/literature/dipk/predictor.py" = 26

# Resolving a registered dataset means downloading a multi-GB .h5mu from a
# credentialed S3 bucket; only the not-found and cache-hit branches are
# reachable offline. The lazy __getattr__ re-export block in the package
# __init__ is only entered by callers that use the deprecated import path.
#
# _load.py's floor is the value CI measures. A developer whose local cache holds a
# real dataset measures ~38% instead, because tests/test_integration.py stops
# skipping, and the gate then offers to ratchet this entry down - do not take it,
# or CI reddens on the next clean checkout.
"drevalpy/data/datasets/__init__.py" = 44
"drevalpy/data/datasets/_load.py" = 27

# Defensive resolution fallbacks for hand-rolled DRPModel subclasses. Every model
# construct_model() produces sets _base_model_config, so the zoo-lookup and
# model_config()-RuntimeError branches are dead for all shipped models.
"drevalpy/models/mixins/_hyperparameters.py" = 57

[tool.complexipy]
max-complexity-allowed = 15
