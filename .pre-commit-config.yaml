repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        exclude: ^uv\.lock$
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: docs/
      - id: trailing-whitespace
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v2.5.1
    hooks:
      - id: prettier
  - repo: https://github.com/rohaquinlop/complexipy-pre-commit
    rev: v6.2.0
    hooks:
      - id: complexipy
        types_or: [python, pyi]
        files: ^drevalpy/
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        # Deselect network-marked tests, matching CI. They need pretrained weights
        # from the artifacts bucket, which is not readable without credentials.
        entry: uv run pytest -m "not network"
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
