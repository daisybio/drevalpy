repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        exclude: ^uv\.lock$
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: docs/
      - id: trailing-whitespace
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v2.5.1
    hooks:
      - id: prettier
  - repo: https://github.com/rohaquinlop/complexipy-pre-commit
    rev: v6.2.0
    hooks:
      - id: complexipy
        types_or: [python, pyi]
        files: ^drevalpy/
  - repo: local
    hooks:
      - id: pytest
        name: pytest (fast tier)
        # No arguments on purpose: `addopts` in pyproject.toml defaults to
        # `-m "not slow and not network"`, which is the fast tier. Coverage and
        # the per-module coverage gate run in CI on the full suite
        # (`.github/workflows/run_tests.yml`), not here: the floors are only
        # meaningful on the full suite, and measuring coverage roughly doubles
        # the run on top of that.
        #
        # Tier definitions, timings and the commands to run each tier live in
        # the "Running tests" section of AGENTS.md - the single source for those
        # numbers. Do not restate them here.
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
