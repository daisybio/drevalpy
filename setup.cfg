[metadata]
license_files = LICENSE.txt
[tool.black]
line-length = 120
[tool.isort]
multi_line_output=3
include_trailing_comma=true
balanced_wrapping=true
line_length=120
profile = "black"
[flake8]
max-line-length = 120
max-complexity = 10
docstring-convention = google
per-file-ignores =
	# Subprocess isolation checks intentionally invoke trusted local Python -c scripts.
	tests/*:S101,S301,S403,S404,S603,D103
	tests/cli/*:S101,D103,DAR101,DAR103
	# Parity-preserved literature engines relocated from drevalpy.models.*.
	drevalpy/components/predictors/literature/impl/*:D101,D102,D103,D105,D107,D212,DAR101,DAR201,DAR401,RST304,C901
	# Featurizer protocol modules (fit/transform/state share base-class docs).
	drevalpy/components/featurizers/*:D102,D107,DAR101,DAR201,DAR401
	# Predictor wrappers outside impl/ (thin fit/predict/state methods).
	drevalpy/components/predictors/*:D102,D105,D107,DAR101,DAR201,DAR401
	drevalpy/components/registry/*:D107,DAR101,DAR201,DAR401
	# Top-level component glue: darglint deferred (RST304 no longer blanket-ignored).
	drevalpy/components/*.py:DAR101,DAR201,DAR401
	# Tuning orchestration modules (Ray/Optuna path).
	drevalpy/components/tuning/*.py:DAR101,DAR201,DAR401
	# Model orchestration modules (ModelConfig / component stack / zoo).
	# Keep DAR ignores on the specific drp_model.py entry: flake8 uses the most
	# specific per-file style guide and does not merge with models/*.py.
	drevalpy/models/*.py:D102,D107,DAR101,DAR201,DAR401
	drevalpy/models/drp_model.py:D212,D102,D107,DAR101,DAR201,DAR401
	drevalpy/cli/*:D103,DAR101,DAR103,DAR201
	drevalpy/cli_run_cv.py:DAR101,DAR401
	drevalpy/cli_preprocess_custom.py:DAR101
	drevalpy/cli_model_testing.py:DAR101,DAR201,DAR401
	drevalpy/visualization/create_report.py:DAR101
	drevalpy/datasets/curvecurator.py:S404,S603
docstring_style = sphinx
