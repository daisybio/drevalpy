[metadata]
license_files = LICENSE.txt
[tool.black]
line-length = 120
[tool.isort]
multi_line_output=3
include_trailing_comma=true
balanced_wrapping=true
line_length=120
profile = "black"
[flake8]
max-line-length = 120
max-complexity = 10
docstring-convention = google
# Black-compatible slice spacing (E203) and line-break-before-binary-operator (W503).
extend-ignore = D212,E203,W503
per-file-ignores =
	# Subprocess isolation checks intentionally invoke trusted local Python -c scripts.
	tests/*:S101,S301,S403,S404,S603,D103,C901,N806,S615
	# Outrank */components/predictors/* for mirrored predictor tests.
	tests/components/predictors/*:S101,S301,S403,S404,S603,D103,C901,N806,S615
	tests/components/predictors/literature/*:S101,S301,S403,S404,S603,D103,C901,N806,S615
	tests/cli/*:S101,S301,S403,D103,DAR101,DAR103
	docs/conf.py:D212,DAR101,DAR201
	tests/visualization/*.py:E402,S101,D103
	tests/experiment/*.py:S101,D103,DAR101
	# sklearn fit/transform API uses uppercase X; local load_dataset() triggers S615 false positive.
	drevalpy/components/preprocessing.py:N803
	drevalpy/components/tuning/hpo_runtime.py:C901
	drevalpy/utils/pipeline.py:S615
	drevalpy/datasets/curvecurator.py:S404,S603
docstring_style = sphinx
