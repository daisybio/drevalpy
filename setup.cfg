[metadata]
license_files = LICENSE.txt
[flake8]
max-line-length = 120
max-complexity = 10
docstring-convention = google
# Black-compatible slice spacing (E203) and line-break-before-binary-operator (W503).
# W503 remains necessary: pycodestyle still emits it and Black prefers that break style.
extend-ignore = E203,W503
per-file-ignores =
	# Pytest asserts and minimal test function docstrings are intentional.
	tests/*:S101,D103
	# CurveCurator CLI invoked via validated local config paths.
	drevalpy/datasets/curvecurator.py:S404,S603
docstring_style = sphinx
